kind: pipeline
type: docker
name: image-temp-proof

# Temporary: build the image from this branch's tree and run it the way the
# smoke step runs it (scratch image, --tmpfs /data, no /tmp), which is the
# exact condition that crash-looped on main. Removed before the PR is ready.

steps:
  - name: prove
    image: docker:27
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker build -t thornotes-tmpproof:local .
      - |
        docker rm -f tmpproof >/dev/null 2>&1 || true
        docker run -d --name tmpproof --tmpfs /data thornotes-tmpproof:local >/dev/null
        sleep 8
        echo "state: $(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' tmpproof)"
        docker logs tmpproof 2>&1 | tail -8
        docker stop tmpproof >/dev/null 2>&1 || true
        docker rm tmpproof >/dev/null 2>&1 || true

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - fix/smoke-tmpdir
