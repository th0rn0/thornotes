kind: pipeline
type: docker
name: ci-prune-when-full

# Conditional reclaim on the CI runner. Reports space always; prunes only when
# the daemon's filesystem is above the threshold. Deletes garbage only: exited
# step containers, volumes nothing references, untagged images.

steps:
  - name: report-and-prune
    image: docker:27
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - echo "=== before ==="
      - df -h / | tail -1
      - docker system df
      # BusyBox df has no --output; parse POSIX output instead.
      - USE=$(df -P / | awk 'NR==2{gsub("%","",$5); print $5}')
      - echo "used=${USE}% threshold=80%"
      - if [ "$USE" -ge 80 ]; then
          echo "--- above threshold, reclaiming ---";
          docker ps -aq --filter status=exited | xargs -r docker rm;
          docker volume prune -af;
          docker image prune -f;
          echo "=== after ==="; df -h / | tail -1; docker system df;
        else
          echo "--- below threshold, nothing removed ---";
        fi
      - echo "=== end ==="
      - df -h / | tail -1

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - ops/ci-prune-when-full
