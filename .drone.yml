kind: pipeline
type: docker
name: ci-disk-report

# Reports which runner host a build lands on and how full its Docker filesystem
# is. Read-only on purpose: automated pruning kept failing on this runner's shell
# mangling of multi-line scripts (builds #300-#305), and a report that is always
# right beats a prune that silently does nothing. Reclaim manually with the
# commands in docs/operations.md when the number is high.

steps:
  - name: report
    image: docker:27
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - echo "runner host:"
      - docker info --format '{{.Name}}'
      - echo "filesystem:"
      - df -h / | tail -1
      - echo "docker usage:"
      - docker system df
      - echo "exited step containers: $(docker ps -aq --filter status=exited | wc -l)"
      - echo "dangling images: $(docker images --filter dangling=true -q | wc -l)"

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - ops/ci-prune-when-full
