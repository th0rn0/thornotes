kind: pipeline
type: docker
name: ci-disk-report

# Read-only report of which runner a build lands on and how full its Docker
# filesystem is. No pruning: a conditional prune would not run on this runner
# (Drone substitutes $VAR at dispatch, so shell variables need $$), and a report
# that is always right beats a prune that silently does nothing.
#
# Strings here avoid a colon before the closing quote: Drone's YAML parser
# read `echo "filesystem:"` as a map and rejected the pipeline outright
# (build #306, "cannot unmarshal !!map into string").

steps:
  - name: report
    image: docker:27
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker info --format 'runner={{.Name}}'
      - docker run --rm -v /etc:/hostetc:ro docker:27 cat /hostetc/hostname
      - df -h / /tmp
      - docker run --rm -v /:/host:ro docker:27 df -h /host
      - docker run --rm -v /tmp:/hosttmp:ro docker:27 df -h /hosttmp
      - docker system df
      - docker ps -a --format '{{.Names}} {{.Status}}'
      - docker ps -aq --filter status=exited | wc -l
      - docker images --filter dangling=true -q | wc -l
      - docker volume ls -q | wc -l

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - ops/ci-prune-when-full
